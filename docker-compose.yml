version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: renyou-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: renyou-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - Renyou-Shop-Project--main--v2/backend/.env
    depends_on:
      - mongodb

  frontend-site:
    build:
      context: .
      dockerfile: Dockerfile.frontend.site
    container_name: renyou-site
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

  frontend-admin:
    build:
      context: .
      dockerfile: Dockerfile.frontend.admin
    container_name: renyou-admin
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo_data: